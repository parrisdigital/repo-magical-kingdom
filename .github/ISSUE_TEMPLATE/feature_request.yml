name: Feature proposal
description: Propose a focused product, compiler, rendering, or contributor feature.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I can explain how this preserves truthful repository meaning.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe behavior and scope, not only implementation details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source evidence and visual semantics
      description: If this changes the kingdom vocabulary, identify the repository evidence and how the meaning remains visible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risks
    attributes:
      label: Performance, accessibility, privacy, and licensing impact
